<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Livia · outfit a Roma</title>
<meta name="description" content="I capi dei reel di @livia.aroma, con prezzi e link.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--carta:#fbfaf8;--inchiostro:#1c1b1a;--tenue:#6b6862;--riga:#e4e1db;--accento:#24405e}
@media (prefers-color-scheme:dark){:root{--carta:#141414;--inchiostro:#efede8;--tenue:#a29e96;--riga:#2c2b29;--accento:#9cb7d6}}
*{box-sizing:border-box;margin:0}
body{background:var(--carta);color:var(--inchiostro);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding:0 16px}
main{max-width:560px;margin:0 auto;padding:40px 0 56px}
header{padding-bottom:28px;border-bottom:1px solid var(--riga)}
h1{font:600 2.1rem/1.1 "Fraunces",Georgia,serif;letter-spacing:-.01em}
.utente{color:var(--tenue);margin-top:6px}
.utente a{color:inherit}
article{display:grid;grid-template-columns:132px 1fr;gap:18px;padding:28px 0;border-bottom:1px solid var(--riga)}
article img{width:132px;height:236px;object-fit:cover;border-radius:4px;display:block}
.data{font-size:.78rem;letter-spacing:.04em;color:var(--tenue)}
h2{font:500 1.3rem/1.2 "Fraunces",Georgia,serif;margin:2px 0 12px}
ul{list-style:none;padding:0}
li{border-top:1px solid var(--riga)}
li a{display:flex;justify-content:space-between;gap:12px;padding:9px 0;color:var(--inchiostro);text-decoration:none}
li a:hover .nome,li a:focus-visible .nome{text-decoration:underline;text-decoration-color:var(--accento)}
.nome{font-size:.93rem}
.nome small{display:block;color:var(--tenue);font-size:.78rem}
.prezzo{font-weight:600;white-space:nowrap;color:var(--accento)}
.prezzi{font-size:.75rem;color:var(--tenue);margin-top:8px}
.vuoto{padding:28px 0;color:var(--tenue)}
footer{font-size:.78rem;color:var(--tenue);padding-top:24px}
@media (max-width:420px){article{grid-template-columns:96px 1fr;gap:14px}article img{width:96px;height:172px}}
</style></head>
<body><main>
<header><h1>Livia · outfit a Roma</h1>
<p class="utente"><a href="https://www.instagram.com/livia.aroma/">@livia.aroma</a> · i capi di ogni reel</p></header>
<p class="vuoto">Il primo outfit arriva a breve.</p>
<footer>Immagini generate con IA.</footer>
</main></body></html>
